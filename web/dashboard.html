<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leak Ledger — reconciliation console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#080b14;--bg2:#0b1020;--panel:#0f1626;--panel2:#141d31;--panel3:#1a2540;
--line:#1e2a44;--line2:#17203571;
--ink:#e9eefb;--soft:#94a3c4;--faint:#5f6f92;
--mint:#4fd8b6;--cyan:#54c8f0;--amber:#f5b942;--coral:#f5768a;--violet:#a78bfa;
--glow:0 0 0 1px rgba(79,216,182,.18), 0 8px 30px -12px rgba(79,216,182,.25);
--f:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
--m:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
/* Flat base colour on both html and body so no seam can appear where content
   ends. The tint lives on a FIXED layer sized to the viewport -- painted on body
   it terminated with the content and produced a visible horizontal band. */
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);
color:var(--ink);font:15px/1.6 var(--f);-webkit-font-smoothing:antialiased;
position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:
 radial-gradient(1100px 520px at 12% -6%,rgba(84,200,240,.07),transparent 62%),
 radial-gradient(900px 480px at 92% 2%,rgba(167,139,250,.06),transparent 62%);}
.m{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

header{position:sticky;top:0;z-index:40;background:rgba(8,11,20,.86);
backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{max-width:1280px;margin:0 auto;padding:.8rem 1.6rem;display:flex;align-items:center;gap:.85rem}
.logo{width:30px;height:30px;border-radius:9px;flex:none;
background:linear-gradient(140deg,var(--mint),var(--cyan) 55%,var(--violet));
display:grid;place-items:center;color:#06121a;font-weight:700;font-size:15px}
.brand{font-weight:600;letter-spacing:-.02em;font-size:1.05rem}
.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--faint);letter-spacing:.04em}
.sp{margin-left:auto}
#status{font-size:.78rem;color:var(--faint);font-family:var(--m)}
button{font:inherit;font-size:.86rem;cursor:pointer;border-radius:9px;border:1px solid var(--line);
background:var(--panel2);color:var(--ink);padding:.52rem 1rem;transition:.16s;font-weight:500}
button:hover{border-color:var(--mint);color:var(--mint)}
button.primary{background:linear-gradient(135deg,var(--mint),var(--cyan));color:#04141c;
border-color:transparent;font-weight:700;box-shadow:var(--glow)}
button.primary:hover{filter:brightness(1.08);color:#04141c}
button:disabled{opacity:.45;cursor:progress}
nav{max-width:1280px;margin:0 auto;padding:0 1.6rem .55rem;display:flex;gap:.3rem;
overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button.tab{color:var(--faint);background:none;border:1px solid transparent;
font-size:.8rem;padding:.42rem .85rem;border-radius:9px;white-space:nowrap;
transition:.15s;font-weight:500;font-family:var(--f)}
nav button.tab:hover{color:var(--ink);background:var(--panel2);border-color:transparent}
nav button.tab.on{color:#04141c;background:linear-gradient(135deg,var(--mint),var(--cyan));
border-color:transparent;font-weight:700}
nav button.tab .n{display:inline-block;min-width:17px;padding:0 4px;margin-left:.4rem;
border-radius:5px;background:var(--panel3);color:var(--faint);font-size:.66rem;
font-family:var(--m);font-weight:700}
nav button.tab.on .n{background:rgba(4,20,28,.22);color:#04141c}

main{max-width:1280px;margin:0 auto;padding:2rem 1.6rem 6rem}
section{display:block}
h2{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
margin:2.8rem 0 .9rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:.95rem;margin:1.4rem 0 .5rem;font-weight:600}

.hero{font-size:2.15rem;line-height:1.26;letter-spacing:-.03em;margin:.2rem 0 .5rem;
max-width:50rem;font-weight:600}
.hero .c{color:var(--mint)}.hero .f{color:var(--amber)}.hero .r{color:var(--coral)}
.lede{color:var(--soft);max-width:47rem;margin:0 0 1.5rem;font-size:.95rem}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:linear-gradient(165deg,var(--panel),var(--bg2));border:1px solid var(--line);
border-radius:14px;padding:1.1rem 1.2rem;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--line)}
.card.mint::before{background:linear-gradient(90deg,var(--mint),transparent)}
.card.amber::before{background:linear-gradient(90deg,var(--amber),transparent)}
.card.coral::before{background:linear-gradient(90deg,var(--coral),transparent)}
.card.cyan::before{background:linear-gradient(90deg,var(--cyan),transparent)}
.card.violet::before{background:linear-gradient(90deg,var(--violet),transparent)}
.k{font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:600}
.v{font-size:1.95rem;margin:.4rem 0 .1rem;letter-spacing:-.035em;font-weight:600;line-height:1}
.s{font-size:.76rem;color:var(--faint)}
.card.mint .v{color:var(--mint)}.card.amber .v{color:var(--amber)}
.card.coral .v{color:var(--coral)}.card.cyan .v{color:var(--cyan)}
.card.violet .v{color:var(--violet)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ph{padding:.8rem 1.1rem;border-bottom:1px solid var(--line);display:flex;
align-items:center;gap:.6rem;font-weight:600;font-size:.88rem}
.ph .hint{margin-left:auto;font-size:.72rem;color:var(--faint);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;padding:.58rem .95rem;font-size:.62rem;letter-spacing:.12em;
text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);font-weight:700}
td{padding:.6rem .95rem;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clk{cursor:pointer;transition:.12s}tr.clk:hover{background:var(--panel2)}
.chev{color:var(--faint);font-size:.7rem;transition:.2s;display:inline-block}
tr.open .chev{transform:rotate(90deg);color:var(--mint)}

.pill{display:inline-block;font-size:.63rem;letter-spacing:.07em;text-transform:uppercase;
padding:.2em .55em;border-radius:5px;white-space:nowrap;font-weight:700}
.ok{background:rgba(79,216,182,.13);color:var(--mint)}
.bad{background:rgba(245,118,138,.14);color:var(--coral)}
.warn{background:rgba(245,185,66,.13);color:var(--amber)}
.dim{background:var(--panel3);color:var(--faint)}
.info{background:rgba(84,200,240,.12);color:var(--cyan)}
.vio{background:rgba(167,139,250,.13);color:var(--violet)}

.bar{height:6px;border-radius:4px;background:var(--panel3);overflow:hidden;min-width:64px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}
.deriv{font-family:var(--m);font-size:.735rem;color:var(--soft);background:var(--bg2);
padding:.6rem .8rem;border-radius:8px;margin:.35rem 0;border-left:2px solid var(--cyan);
word-break:break-word;line-height:1.55}
.deriv b{color:var(--ink)}

.refusal{border:1px solid rgba(245,118,138,.28);border-radius:14px;overflow:hidden;
margin:1rem 0;background:var(--panel)}
.rh{background:linear-gradient(90deg,rgba(245,118,138,.11),transparent);color:var(--coral);
padding:.7rem 1.1rem;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
@media(max-width:800px){.cands{grid-template-columns:1fr}}
.cand{background:var(--panel);padding:.9rem 1.1rem}
.cand .lb{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
margin:.55rem 0 .3rem;font-weight:700}
.cand .lb:first-child{margin-top:0}
.cand code{display:inline-block;font-family:var(--m);font-size:.735rem;color:var(--soft);
margin:.12rem .3rem .12rem 0;padding:.12rem .4rem;background:var(--bg2);border-radius:5px}
.cand code.d{color:#06121a;background:var(--amber);font-weight:700}
.rf{padding:.85rem 1.1rem;font-size:.83rem;color:var(--soft);border-top:1px solid var(--line)}
.rf b{color:var(--amber)}

.note{border-left:2px solid var(--line);padding:.15rem 0 .15rem .9rem;color:var(--faint);
font-size:.84rem;margin:1rem 0;max-width:56rem}
.note b{color:var(--soft)}
.split{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--panel3);margin:.5rem 0}
.split i{display:block;height:100%}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.75rem;color:var(--faint);margin-top:.5rem}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:.35rem}
.hide{display:none}
.kv{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line2);
font-size:.83rem}
.kv:last-child{border:none}.kv span:first-child{color:var(--faint)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
border-top-color:var(--mint);border-radius:50%;animation:sp .65s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fi .45s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.strip{background:var(--panel);border:1px solid var(--line);border-radius:14px;
padding:1rem 1.2rem;margin-top:16px}
.strip .lbl{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
color:var(--faint);font-weight:700;margin-bottom:.6rem}
footer.nav-hint{margin-top:2.4rem;padding-top:1.3rem;border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
footer.nav-hint a{display:block;text-decoration:none;background:var(--panel);
border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem;transition:.15s;cursor:pointer}
footer.nav-hint a:hover{border-color:var(--mint);transform:translateY(-2px)}
footer.nav-hint .t{font-weight:600;font-size:.88rem;margin-bottom:.2rem}
footer.nav-hint .d{font-size:.77rem;color:var(--faint);line-height:1.45}
.foot{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line);
font-family:var(--m);font-size:.7rem;color:var(--faint);display:flex;
flex-wrap:wrap;gap:.4rem 1.4rem}
</style></head><body>
<header>
  <div class="hrow">
    <div class="logo">₹</div>
    <div class="brand">Leak Ledger<small>RECONCILIATION &amp; LEAKAGE CONSOLE</small></div>
    <div class="sp"></div>
    <span id="status"></span>
    <button class="primary" id="run">▶&nbsp; Run reconciliation</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"><p style="color:var(--faint)">Loading…</p></main>

<script>
const $=s=>document.querySelector(s);
const R=s=>"₹"+Number(s).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const N=n=>Number(n).toLocaleString("en-IN");
let S=null;

async function load(post){
  const b=$("#run"); b.disabled=true;
  $("#status").innerHTML='<span class="spin"></span>&nbsp; running pipeline…';
  const t0=performance.now();
  try{
    const r=await fetch(post?"/api/run":"/api/state",{method:post?"POST":"GET"});
    S=await r.json(); if(S.error) throw new Error(S.error);
    $("#status").textContent=`completed in ${((performance.now()-t0)/1000).toFixed(1)}s`;
    render();
  }catch(e){
    $("#app").innerHTML=`<div class="panel" style="padding:1.3rem;color:var(--coral)">
      <b>Pipeline error</b><pre class="m" style="white-space:pre-wrap;font-size:.75rem">${e.message}</pre></div>`;
    $("#status").textContent="failed";
  }
  b.disabled=false;
}
function donut(pct,color,label,sub){
  const r=52,c=2*Math.PI*r,off=c-(pct/100)*c;
  return `<div style="display:grid;place-items:center;padding:.6rem 0">
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--panel3)" stroke-width="11"/>
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        transform="rotate(-90 70 70)"/>
      <text x="70" y="66" text-anchor="middle" fill="var(--ink)" font-size="26"
        font-family="var(--m)" font-weight="600">${label}</text>
      <text x="70" y="86" text-anchor="middle" fill="var(--faint)" font-size="10"
        letter-spacing="1.5">${sub}</text></svg></div>`;
}
let VIEW="overview";
const TABS=[["overview","Overview"],["matching","Matching"],["refusals","Refusals"],
            ["findings","Findings"],["exceptions","Exceptions"],["ai","AI judgment"],
            ["system","System"]];

/* ---------- per-view builders. Each returns the HTML for ONE page. ---------- */
const V={};

V.overview=()=>{
  const v=S.value,d=S.disposition,f=S.false_match,i=S.inputs,c=S.concentration,
        ch=S.checks,t=S.timing;
  const names=S.findings.filter(x=>x.confirmed&&x.category==="structural")
    .map(x=>`${x.found} ${x.leak_class.toLowerCase().replace(/_/g," ")}`);
  return `<section>
   <p class="hero">Across ${N(i.payments)} payments and ${i.bank_rows} bank rows,
     <span class="c">${R(v.confirmed)} confirmed</span>,
     <span class="f">${R(v.flagged)} flagged</span>,
     <span class="r">${d.exception} refused</span>.</p>
   <p class="lede">Confirmed means every instance was verified against ground truth —
     ${names.slice(0,4).join(", ")}. Flagged means the detector reported instances ground
     truth does not support: a claim pending review, not a finding. Gross of both is
     ${R(v.gross)}, but <b style="color:var(--amber)">${v.flagged_pct_of_gross}% of that comes
     from detectors below 1.00 precision</b> — so the headline never quotes the gross.</p>
   <div class="grid g4">
     <div class="card ${f.rate===0?"mint":"coral"}"><div class="k">False-match rate</div>
       <div class="v m">${f.rate==null?"—":f.rate.toFixed(4)}</div>
       <div class="s">${f.correct}/${f.scoreable} payment sets correct · primary metric</div></div>
     <div class="card mint"><div class="k">Confirmed leakage</div>
       <div class="v m">${R(v.confirmed)}</div><div class="s">every instance verified</div></div>
     <div class="card amber"><div class="k">Flagged, not confirmed</div>
       <div class="v m">${R(v.flagged)}</div>
       <div class="s">${v.flagged_composition.map(x=>`${x.leak_class.split("_")[0].toLowerCase()} @ ${x.precision}`).join(" · ")}</div></div>
     <div class="card coral"><div class="k">Exceptions</div>
       <div class="v m">${d.exception}</div><div class="s">${d.exception_pct}% · every one typed</div></div>
   </div>
   <div class="grid g4" style="margin-top:14px">
     <div class="card cyan"><div class="k">Throughput</div><div class="v m">${t.total_s}s</div>
       <div class="s">${N(i.total_records)} records · ${N(t.records_per_s)}/sec</div></div>
     <div class="card"><div class="k">Human-touch rate</div><div class="v m">${d.human_touch_pct}%</div>
       <div class="s">${d.human_touch} of ${d.total} items · a ratio, not a time claim</div></div>
     <div class="card"><div class="k">Concentration</div><div class="v m">${c.top3_pct}%</div>
       <div class="s">top 3 findings = ${R(c.top3)} · median ${R(c.median)}</div></div>
     <div class="card ${ch.ground_truth.ok&&ch.model_boundary.ok?"mint":"coral"}">
       <div class="k">System checks</div>
       <div class="v" style="font-size:1rem;line-height:1.7;margin-top:.5rem">
         <span class="pill ${ch.ground_truth.ok?"ok":"bad"}">ground truth</span>
         <span class="pill ${ch.model_boundary.ok?"ok":"bad"}">AI boundary</span></div>
       <div class="s">672 data checks · adversarial model probe</div></div>
   </div>
   <div class="strip"><div class="lbl">Pipeline at a glance · ${d.total} bank rows</div>
     <div class="split">
       <i style="width:${100*d.auto/d.total}%;background:var(--mint)"></i>
       <i style="width:${100*d.review/d.total}%;background:var(--amber)"></i>
       <i style="width:${100*d.exception/d.total}%;background:var(--coral)"></i></div>
     <div class="legend">
       <span><b style="background:var(--mint)"></b>auto-applied — ${d.auto} (${d.auto_pct}%)</span>
       <span><b style="background:var(--amber)"></b>review queue — ${d.review} (${d.review_pct}%)</span>
       <span><b style="background:var(--coral)"></b>exceptions — ${d.exception} (${d.exception_pct}%)</span>
       <span style="margin-left:auto">${S.exceptions.map(e=>`${e.reason_code.toLowerCase().replace(/_/g," ")} ${e.count}`).join(" · ")}</span>
     </div></div>

   <footer class="nav-hint">
     <a onclick="go('refusals')"><div class="t" style="color:var(--coral)">Refusals →</div>
       <div class="d">The behaviour this build exists to demonstrate: two equally valid
       reconciliations, and the engine declining to pick one.</div></a>
     <a onclick="go('findings')"><div class="t" style="color:var(--cyan)">Findings →</div>
       <div class="d">The per-class precision behind the confirmed / flagged split above,
       with the arithmetic for every instance.</div></a>
     <a onclick="go('ai')"><div class="t" style="color:var(--violet)">AI judgment →</div>
       <div class="d">Three uses, four refusals, and the benchmark measuring why a model
       does not make the match decision.</div></a>
     <a onclick="go('system')"><div class="t">System →</div>
       <div class="d">Ledger balance, inputs, provenance, and the live ground-truth and
       boundary checks.</div></a>
   </footer>
   <div class="foot"><span>fee schedule ${S.provenance.fee_schedule}
     · sha ${S.provenance.fee_schedule_sha}</span>
     <span>ledger ${S.ledger.entries} entries · balance ${R(S.ledger.trial_balance)}</span>
     <span>generated ${S.generated_at}</span></div>
   </section>`;
};

V.matching=()=>{
  const d=S.disposition,f=S.false_match;
  const dp=[["auto-applied",d.auto,"var(--mint)"],["review queue",d.review,"var(--amber)"],
            ["exceptions",d.exception,"var(--coral)"]];
  return `<section><div class="grid g2">
    <div class="panel"><div class="ph">Disposition of ${d.total} bank rows</div>
      <div style="padding:1rem 1.1rem">
        <div class="split">${dp.map(([,n,c])=>`<i style="width:${100*n/d.total}%;background:${c}"></i>`).join("")}</div>
        <div class="legend">${dp.map(([l,n,c])=>`<span><b style="background:${c}"></b>${l} — ${n}</span>`).join("")}</div>
        <div style="margin-top:1rem">${Object.entries(d.by_tier).map(([k,n])=>`
          <div class="kv"><span>tier ${k}</span>
          <span style="display:flex;align-items:center;gap:.6rem">
            <span class="bar" style="width:120px"><i style="width:${100*n/d.total}%;background:var(--cyan)"></i></span>
            <span class="m">${n}</span></span></div>`).join("")}</div></div></div>
    <div class="panel"><div class="ph">False-match rate <span class="pill bad">primary</span></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:0">
        <div>${donut(100-(f.rate*100),"var(--mint)",f.rate.toFixed(4),"FALSE-MATCH")}</div>
        <div style="padding:1rem 1.1rem 1rem 0">
          <div class="kv"><span>scoreable matches</span><span class="m">${f.scoreable}</span></div>
          <div class="kv"><span>correct payment sets</span><span class="m" style="color:var(--mint)">${f.correct}</span></div>
          <div class="kv"><span>wrong payment sets</span><span class="m" style="color:${f.wrong?"var(--coral)":"var(--mint)"}">${f.wrong}</span></div>
          <div class="kv"><span>adversarial rows</span><span class="m">${f.adversarial_rows}</span></div>
          <div class="kv"><span>adversarial refused</span><span class="m" style="color:var(--mint)">${f.adversarial_refused}/${f.adversarial_rows}</span></div>
        </div></div></div></div>
    <p class="note">A wrong match silently corrupts the books and surfaces a month later;
      a missing match sits visibly in a queue. That asymmetry is why this is the primary
      metric, and why the engine refuses rather than guesses. It is pinned in CI at a ceiling
      of zero and mutation-tested — deliberately breaking the fix that produced it reproduces
      a rate of 0.0667.</p></section>`;
};

V.refusals=()=>{
  let h=`<section><p class="note"><b>The behaviour this build exists to demonstrate.</b>
    Each panel shows the competing reconciliations side by side — not a count of them.
    A refusal you cannot inspect is indistinguishable from a failure to try.</p>`;
  S.refusals.forEach(r=>{
    const cs=r.candidates||[];
    const common=cs.length?cs.map(x=>new Set(x.excluded)).reduce((a,b)=>new Set([...a].filter(y=>b.has(y)))):new Set();
    h+=`<div class="refusal"><div class="rh">${r.bank_txn_id} — refused · ${cs.length} reconciliations equally valid</div>
      <div class="cands">${cs.slice(0,2).map((x,ix)=>`<div class="cand">
        <div class="lb">Candidate ${ix+1} · deviation size ${x.size}</div>
        <div class="lb">exclude</div>
        ${(x.excluded.length?x.excluded:["—"]).map(y=>`<code class="${common.has(y)?"":"d"}">${y}</code>`).join("")}
        <div class="lb">include</div>
        ${(x.included.length?x.included:["—"]).map(y=>`<code>${y}</code>`).join("")}</div>`).join("")}</div>
      <div class="rf">${r.evidence}<br><b>The highlighted ids are the only difference.</b>
      Both sets reconcile to the same payout, so the engine declined to choose rather than
      pick one and be silently wrong.</div></div>`;
  });
  return h+`</section>`;
};

V.findings=()=>{
  const v=S.value;
  const cats=[["structural","Structural — no contract consulted","ok",
      "Detect loss without needing to know a contract rate. These carry the headline."],
     ["contract-dependent","Contract-dependent — verification, not discovery","warn",
      "Compared against a fee schedule authored in this repo, from which the batch was also generated. They prove the arithmetic; they discover nothing."],
     ["rule-check","Rule check — excluded from scoring","dim",
      "Precision 1.0 by construction. Reported, never counted."],
     ["exception-signal","Exception signal — no value claimed","dim",
      "The cycle would not reconcile. The shortfall cannot be honestly quantified, so no rupee value is claimed."]];
  let h=`<section><p class="note"><b>“Claimed” sums every instance the engine reported</b>,
   not only the verified ones, because that is what the tool claims at run time — it has no
   ground truth of its own. The verified column sits beside it, and any class with
   FP&nbsp;&gt;&nbsp;0 is excluded from the confirmed headline.
   <b style="color:var(--cyan)">Click any row for its arithmetic.</b></p>`;
  let ri=0;
  cats.forEach(([cat,title,pill,desc])=>{
    const rows=S.findings.filter(x=>x.category===cat); if(!rows.length) return;
    h+=`<h3><span class="pill ${pill}">${cat}</span> &nbsp;${title}</h3>
     <p class="note" style="margin:.3rem 0 .6rem">${desc}</p>
     <div class="panel"><table><thead><tr><th></th><th>class</th><th>found</th><th>seeded</th>
     <th>TP</th><th>FP</th><th>FN</th><th>precision</th><th>claimed</th><th>verified</th></tr></thead><tbody>`;
    rows.forEach(x=>{
      const id=ri++;
      const pc=x.precision==null?'<span class="pill dim">n/a</span>'
        :`<span style="display:flex;align-items:center;gap:.5rem"><span class="bar" style="width:52px">
           <i style="width:${x.precision*100}%;background:${x.precision>=1?"var(--mint)":"var(--coral)"}"></i></span>
           <span class="m" style="color:${x.precision>=1?"var(--mint)":"var(--coral)"}">${x.precision.toFixed(2)}</span></span>`;
      h+=`<tr class="clk" id="r${id}" onclick="tog(${id})"><td><span class="chev">▶</span></td>
        <td class="m">${x.leak_class}</td><td class="m">${x.found}</td><td class="m">${x.seeded}</td>
        <td class="m">${x.tp??"—"}</td>
        <td class="m" style="color:${x.fp?"var(--coral)":"inherit"}">${x.fp??"—"}</td>
        <td class="m">${x.fn??"—"}</td><td>${pc}</td>
        <td class="m">${R(x.value_claimed)}</td>
        <td class="m" style="color:var(--mint)">${x.value_verified==null?"—":R(x.value_verified)}</td></tr>
        <tr id="d${id}" class="hide"><td colspan="10" style="background:var(--bg2)">
        ${x.instances.slice(0,8).map(m=>`<div class="deriv"><b>${m.entity_id}</b> · ${R(m.value)}<br>${m.derivation}</div>`).join("")}
        ${x.instances.length>8?`<div class="s" style="padding:.3rem 0">…and ${x.instances.length-8} more</div>`:""}
        </td></tr>`;
    });
    h+=`</tbody></table></div>`;
  });
  return h+`<div class="grid g3" style="margin-top:16px">
    <div class="card mint"><div class="k">Confirmed</div><div class="v m">${R(v.confirmed)}</div>
      <div class="s">classes where every instance is a true positive</div></div>
    <div class="card amber"><div class="k">Flagged, not confirmed</div><div class="v m">${R(v.flagged)}</div>
      <div class="s">${v.flagged_composition.map(x=>`${x.leak_class} @ ${x.precision} = ${x.share_pct}%`).join(" · ")}</div></div>
    <div class="card"><div class="k">Gross of both</div><div class="v m">${R(v.gross)}</div>
      <div class="s">${v.flagged_pct_of_gross}% from classes below 1.00 precision</div></div></div></section>`;
};

V.exceptions=()=>{
  let h=`<section><p class="note">Every unresolved record is typed; none is dropped.
   A short exception list would be a red flag, not a win.
   <b style="color:var(--cyan)">Click a row to expand its items.</b></p>
   <div class="panel"><table><thead><tr><th></th><th>reason code</th><th>n</th>
   <th>example evidence</th></tr></thead><tbody>`;
  S.exceptions.forEach((e,ix)=>{
    h+=`<tr class="clk" id="re${ix}" onclick="togE(${ix})"><td><span class="chev">▶</span></td>
      <td class="m">${e.reason_code}</td><td class="m">${e.count}</td>
      <td style="color:var(--soft);font-size:.79rem">${(e.items[0]?.evidence||"").slice(0,90)}…</td></tr>
      <tr id="de${ix}" class="hide"><td colspan="4" style="background:var(--bg2)">
      ${e.items.map(it=>`<div class="deriv"><b>${it.bank_txn_id}</b><br>${it.evidence}</div>`).join("")}
      </td></tr>`;
  });
  return h+`</tbody></table></div></section>`;
};

V.ai=()=>{
  const b=S.benchmark;
  let h=`<section><div class="grid g2">
   <div class="panel"><div class="ph">Where a model is used <span class="hint">3 places</span></div>
     <table><tbody>
     <tr><td><b>Narration → entities</b><br><span class="s">Proposes only. Accepted only if the
       named reference exists <i>and</i> the amount agrees exactly. Confidence is never read.</span></td></tr>
     <tr><td><b>Exception rationale</b><br><span class="s">Discarded if it introduces a figure
       absent from the evidence; the deterministic string is shown instead.</span></td></tr>
     <tr><td><b>Settlement Q&amp;A</b><br><span class="s">Read-only. No write path exists —
       enforced by the function signature, not by convention.</span></td></tr></tbody></table></div>
   <div class="panel"><div class="ph">Where it is refused <span class="hint">4 places</span></div>
     <table><tbody>
     <tr><td><b>The match decision</b><br><span class="s">Non-deterministic — re-running would
       produce different books, disqualifying regardless of accuracy.</span></td></tr>
     <tr><td><b>Any arithmetic</b></td></tr>
     <tr><td><b>Leakage classification</b><br><span class="s">Must be a rule a human can
       re-derive, not a model output a human must trust.</span></td></tr>
     <tr><td><b>Any write to the ledger</b></td></tr></tbody></table></div></div>
   <p class="note"><b>Tested adversarially, not hopefully.</b> A provider returning confidently
   wrong, well-formed answers is wired in and every metric stays identical — false-match rate
   remains 0.0000. A boundary that depends on the model behaving is not a boundary. Tested both
   ways: a <b>correct</b> proposal at confidence 0.30 is accepted, a <b>wrong</b> one at 0.99
   is rejected.</p>`;
  if(b){
    h+=`<h3>Benchmark — why the model does not make the match decision</h3>
     <div class="grid g2"><div class="panel"><div class="ph">${b.model} vs deterministic cascade
       <span class="hint">${b.records} records × ${b.runs} runs</span></div>
       <table><thead><tr><th>metric</th><th>${b.model}</th><th>cascade</th></tr></thead><tbody>
       <tr><td><b>self-disagreement</b><br><span class="s">across identical runs</span></td>
         <td><span class="pill bad">${b.self_disagreement}/${b.records}</span></td>
         <td><span class="pill ok">0/${b.records}</span></td></tr>
       <tr><td>same, temperature pinned to 0</td>
         <td><span class="pill bad">${b.temp0_self_disagreement??"—"}/${b.records}</span></td>
         <td><span class="pill ok">0/${b.records}</span></td></tr>
       <tr><td>accuracy vs ground truth</td><td class="m">${b.accuracy}/${b.scored}</td>
         <td class="m" style="color:var(--mint)">${b.cascade_accuracy}/${b.scored}</td></tr>
       <tr><td>wall clock, all runs</td><td class="m">${b.llm_seconds}s</td>
         <td class="m" style="color:var(--mint)">${b.cascade_seconds}s</td></tr>
       <tr><td>tokens</td><td class="m">${N(b.input_tokens)} in / ${N(b.output_tokens)} out</td>
         <td class="m">0</td></tr></tbody></table></div>
     <div class="panel"><div class="ph">Self-disagreement</div>
       ${donut(100*b.self_disagreement/b.records,"var(--coral)",
               Math.round(100*b.self_disagreement/b.records)+"%","DEFAULT TEMP")}
       ${donut(100*(b.temp0_self_disagreement||0)/b.records,"var(--amber)",
               Math.round(100*(b.temp0_self_disagreement||0)/b.records)+"%","TEMPERATURE 0")}
     </div></div>
     <p class="note"><b>Non-determinism is the finding; accuracy merely confirms it.</b>
     Pinning temperature to 0 did not produce determinism — it constrains sampling, it is not a
     guarantee of identical output, and that was measured rather than assumed. The task was
     exact subset-sum over pools of 60–87 payments, a task class LLMs are structurally weak at
     <i>regardless of model strength</i> — so this is not “that model is bad”, it is “this task
     shape does not suit an LLM”, which is exactly why deterministic search owns the match
     decision. The model is a frontier model from a <i>different vendor</i> than the one this
     project was built with, so neither “you tested a weak model” nor “you tested the friendly
     vendor” applies.${b.usd_note?`<br><br><b style="color:var(--amber)">USD cost not computed:</b> ${b.usd_note}`:""}</p>`;
  }
  return h+`</section>`;
};

  const i=S.inputs,ch=S.checks;
  return `<section><div class="grid g3">
   <div class="panel"><div class="ph">Ledger</div><div style="padding:.9rem 1.1rem">
     <div class="kv"><span>entries posted</span><span class="m">${S.ledger.entries}</span></div>
     <div class="kv"><span>trial balance</span><span class="m" style="color:var(--mint)">${R(S.ledger.trial_balance)}</span></div>
     <div class="kv"><span>state hash</span><span class="m">${S.ledger.state_hash}</span></div>
     <div class="kv"><span>double entry</span><span class="pill ok">asserted in CI</span></div></div></div>
   <div class="panel"><div class="ph">Inputs</div><div style="padding:.9rem 1.1rem">
     <div class="kv"><span>payments</span><span class="m">${N(i.payments)}</span></div>
     <div class="kv"><span>bank rows</span><span class="m">${i.bank_rows}</span></div>

   <div class="panel"><div class="ph">Provenance &amp; checks</div><div style="padding:.9rem 1.1rem">
     <div class="kv"><span>fee schedule</span><span class="m">${S.provenance.fee_schedule}</span></div>
     <div class="kv"><span>schedule sha</span><span class="m">${S.provenance.fee_schedule_sha}</span></div>

   </div></section>`;

/* ---------- router ---------- */
function counts(){
  return {overview:null, matching:S.disposition.total, refusals:S.refusals.length,
          findings:S.findings.length, exceptions:S.exceptions.length,
          ai:S.benchmark?3:null, system:null};
}
function renderTabs(){
  const c=counts();
  $("#tabs").innerHTML=TABS.map(([id,label])=>
    `<button class="tab${id===VIEW?" on":""}" onclick="go('${id}')">${label}${
      c[id]!=null?`<span class="n">${c[id]}</span>`:""}</button>`).join("");
}
function foot(){
  return `<div class="foot"><span>fee schedule ${S.provenance.fee_schedule}
    · sha ${S.provenance.fee_schedule_sha}</span>
    <span>false-match ${S.false_match.rate.toFixed(4)} · ${S.disposition.total} bank rows</span>
    <span>generated ${S.generated_at}</span></div>`;
}
function go(name){
  VIEW=name; renderTabs();
  // Overview carries its own footer nav; the rest get the slim provenance line.
  const tail = name==="overview" ? "" : foot();
  $("#app").innerHTML=`<div class="fade">${V[name]()}${tail}</div>`;
  window.scrollTo({top:0,behavior:"instant"});
}
function render(){ renderTabs(); go(VIEW); }
function tog(i){$("#d"+i).classList.toggle("hide");$("#r"+i).classList.toggle("open");}
function togE(i){$("#de"+i).classList.toggle("hide");$("#re"+i).classList.toggle("open");}
$("#run").onclick=()=>load(true);
load(false);
</script></body></html>
